<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jenkins Deployment Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        nav {
            background: #1f2937;
            color: white;
            padding: 15px 40px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }

        footer {
            text-align: center;
            background: #1f2937;
            color: white;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<nav>
    <h2>Jenkins Demo Project</h2>
</nav>

<section class="hero">
    <h1>version 1</h1>
    <h1>Welcome to Jenkins Deployment Demo</h1>
    <p>This page was deployed using Jenkins CI/CD.</p>

    <button onclick="showMessage()">Verify Deployment</button>

    <div id="message"></div>
</section>

<footer>
    Experiment No. 3 - Jenkins Installation and Setup
</footer>

<script>
    function showMessage() {
        document.getElementById("message").innerHTML =
            "Deployment Successful! Jenkins is working correctly.";
    }
</script>

</body>
</html>
